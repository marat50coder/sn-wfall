[package]
name = "gate_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# All FFI symbols are exported through a C ABI so Dart's `DynamicLibrary`
# can bind them with `lookup`. The library name has to match what Flutter
# loads at runtime (`libgate_core.so` on Android, `gate_core.dll` on
# Windows, `libgate_core.dylib` on macOS).
name = "gate_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Blocking HTTPS from inside the .so so the config endpoint never has to
# travel through Dart. rustls keeps the binary self-contained — no OpenSSL,
# no system CA bundle lookups via strings.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timing + randomised obfuscation.
once_cell = "1"

[profile.release]
# Strip symbols, LTO and `panic = "abort"` make the resulting .so both
# smaller and significantly harder to introspect with `strings`/`nm`.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
# Disable overflow checks only in release so the obfuscation math (lots of
# wrapping ops) stays fast.
overflow-checks = false

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
