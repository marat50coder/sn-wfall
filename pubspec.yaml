# ----------------------------------------------------------
# Snowfall Odyssey — Flutter / Android
# ----------------------------------------------------------
# White slot game + gray WebView portal driven by an
# attribution verdict. The two trees do not cross-import; the
# gray stack lives in lib/prism/** and lib/prelude/**.
# ----------------------------------------------------------

name: snowfall_odyssey
description: "Snowfall Odyssey — a cascading slot adventure for points."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # ----- WebView + routing -----
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0

  # ----- Network sense + HTTP -----
  connectivity_plus: ^7.1.1
  http: ^1.6.0
  url_launcher: ^6.3.2

  # ----- Attribution / messaging -----
  # Floors from gray_part_pitfalls.md §19; bumped a touch to
  # differentiate from the gray_part_flow_android template.
  appsflyer_sdk: ^6.18.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1

  # ----- Persistence -----
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # ----- Device + env -----
  device_info_plus: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/Snowfall_Odyssey_gameplay_assets/
    - assets/Snowfall_Odyssey_additional_assets/
    - assets/icon/icon.png
    - assets/symbols/
    - assets/badges/
    - assets/magic/
    - assets/characters/
    - assets/wheels/
    - assets/logo/

# Launcher icons are hand-wired via mipmap-anydpi-v26/ic_launcher.xml
# so the adaptive icon joins the Android-12 splash. flutter_launcher_icons
# only regenerates the legacy pre-API-26 mipmaps.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
