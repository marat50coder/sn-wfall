name: odysseygame
description: "Snowfall Odyssey - slot game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  # FFI utilities (Pointer<Uint8>, calloc) used by the Rust bridge in
  # `lib/gate/gate_core.dart`.
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/Snowfall_Odyssey_gameplay_assets/bg1_asset.webp
    - assets/Snowfall_Odyssey_gameplay_assets/bg2_asset.webp
    - assets/Snowfall_Odyssey_gameplay_assets/bg3_asset.webp
    - assets/Snowfall_Odyssey_additional_assets/Game_Name.webp
    - assets/Snowfall_Odyssey_additional_assets/Vertical_Loading_Screen.webp
    - assets/Snowfall_Odyssey_additional_assets/Horizontal_Loading_Screen.webp
    - assets/Snowfall_Odyssey_additional_assets/Vertical_Notifications_Screen.webp
    - assets/Snowfall_Odyssey_additional_assets/Horizontal_Notifications_Screen.webp
    - assets/icon/icon.png
    - assets/symbols/
    - assets/badges/
    - assets/magic/
    - assets/characters/
    - assets/wheels/
    - assets/logo/

flutter_launcher_icons:
  # Follow the same setup as Tower_Breaker: only legacy pre-API-26 mipmaps are
  # generated here. The adaptive icon in mipmap-anydpi-v26 is hand-written so
  # it can share one <adaptive-icon> definition and won't be overwritten on
  # subsequent runs of this tool.
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
